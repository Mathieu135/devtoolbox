[package]
name = "toolbox-demo-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
futures-lite = "2"
lapin = "=4.11.0"
redis = { version = "=1.4.1", features = ["tokio-rustls-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
