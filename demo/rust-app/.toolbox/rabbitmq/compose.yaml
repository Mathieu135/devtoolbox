# Generated by devtoolbox. Re-run with --force to replace local edits.
services:
  rabbitmq:
    image: rabbitmq:4.3.3-management
    environment:
      RABBITMQ_DEFAULT_USER: toolbox
      RABBITMQ_DEFAULT_PASS: toolbox-local-only
    ports:
      - "${TOOLBOX_RABBITMQ_PORT:-5672}:5672"
      - "${TOOLBOX_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  rabbitmq-data:
